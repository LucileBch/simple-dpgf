services:
  mongo:
    image: mongo
    container_name: mongo-simple-dpgf
    build:
      context: ./
      dockerfile: Dockerfile
    env_file: ./.env
    ports:
      - "20001:27017"
    restart: always
    environment:
      - MONGO_INIT_DB=simple-dpgf
    volumes:
      - simple-dce-mongo-data:/data
      - ./init-files/:/docker-entrypoint-initdb.d/:ro

  mongo-setup:
    container_name: mongo-setup-simple-dpgf
    build:
      context: ./setup
      dockerfile: Dockerfile
    environment:
      - DATABASE_HOST=mongo-simple-dpgf
    depends_on:
      - mongo
    volumes:
      - ./setup/setup.sh:/setup.sh
    restart: "no"

  smtp4dev:
    image: rnwood/smtp4dev
    restart: always
    ports:
      - "9025:25"
      - "5000:80"

volumes:
  simple-dce-mongo-data: